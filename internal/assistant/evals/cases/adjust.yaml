# MM115: the adjust suite. Each case plays the browser: the user's message carries `before`, and each edit the model makes is answered with the next canned `after` meters. Graded: rounds in range (<= 3), the last meters the model saw satisfy `final`, and every adjusting edit and the closing message cite a figure.
- id: adjust-photo-underexposed
  surface: photo
  requires: photo
  fixture_doc: photo/blank.json
  frame: photo/flat-dull.jpg
  message: "Fix the exposure, it is too dark"
  adjust:
    before: {meanLuma: 0.18, shadowsClipped: 0.09, highlightsClipped: 0.0}
    after:
      - {meanLuma: 0.3, shadowsClipped: 0.05, highlightsClipped: 0.0}
      - {meanLuma: 0.43, shadowsClipped: 0.008, highlightsClipped: 0.004}
    rounds: {min: 2, max: 3}
    final:
      - {metric: meanLuma, min: 0.35, max: 0.55}
      - {metric: shadowsClipped, max: 0.01}
    cites_metric: true
