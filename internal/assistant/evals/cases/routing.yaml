# Medi routing eval suite (MM116a): which tool does the guide send a visitor to?
# >= 120 guide cases, >= 3 in every one of the 18 locales; run with `assistant-eval --suite routing`.
# Never counts toward the per-surface pass rates of the default run (suite: routing).

