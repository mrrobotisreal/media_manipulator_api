# Darkroom copilot cases (MM109 landed the studio op schema; each case has a schema-valid
# reference answer in studio_cases_test.go, so a failure means the model chose badly).
- id: studio-cinematic
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Make it look cinematic"
  expect:
    ops: ["has_op(apply_look) || field(grade, lumetri.saturation) < 1"]
- id: studio-lower-third
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Add a lower-third with my name, Sam Lee, Designer, at 2 seconds"
  expect:
    ops: ["title_in_region(lower30)", "has_op(add_title)"]
- id: studio-title-card
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Put a big title 'Summer' at the start"
  expect:
    ops: ["has_op(add_title)", "field(add_title, start) < 1"]
- id: studio-duck
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "The music is too loud when I talk"
  expect:
    ops: ["has_op(set_ducking) || has_op(set_volume) || has_op(set_keyframes)"]
- id: studio-voice-clear
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Make the voice clearer"
  expect:
    ops: ["has_op(audio_preset)"]
- id: studio-transition
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Add a smooth transition between the two clips"
  expect:
    ops: ["has_op(set_transition)", "field(set_transition, durationSeconds) <= 1.5"]
- id: studio-vertical
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Make this a vertical video for TikTok"
  expect:
    ops: ["has_op(set_canvas)"]
- id: studio-fade-in
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Fade in from black at the start"
  expect:
    ops: ["keyframe_within(opacity, 3000)"]
- id: studio-slowmo
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Slow down the city clip to half speed"
  expect:
    ops: ["field(set_speed, speed) ≈ 0.5"]
- id: studio-ken-burns
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Add a slow zoom in on the beach clip"
  expect:
    ops: ["has_op(set_keyframes)"]
- id: studio-delete-asks
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Delete the second clip"
  expect:
    ask: true
    no_edits: true
- id: studio-captions-suggest
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Add captions"
  expect:
    actions: [suggest:generate_captions]
- id: studio-warmer
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "The beach clip looks cold, warm it up"
  expect:
    ops: ["field(grade, lumetri.temperature) > 0 || has_op(apply_look)"]
- id: studio-marker
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Put a marker at 10 seconds called 'b-roll here'"
  expect:
    ops: ["field(add_marker, at) ≈ 10"]
- id: studio-de-grade
  surface: studio
  requires: studio
  locale: de-DE
  fixture_doc: studio/two-clips.txt
  message: "Mach die Farben etwas kräftiger"
  expect:
    language: de
    ops: ["field(grade, lumetri.saturation) > 1 || field(grade, lumetri.vibrance) > 0 || has_op(apply_look)"]
# --- MM118: Darkroom exports (suggest_action export with params; the server validates them
# against the output table and the case's plan, and swaps an above-plan choice for the
# nearest allowed preset with upgrade.required). Medi never starts the export.
- id: studio-export-reel
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Export this for an Instagram Reel"
  expect:
    actions: [suggest:export]
    export: ["container=mp4", "videoCodec=h264|hevc", "audioCodec=aac"]
    no_edits: true
- id: studio-export-final-cut
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "Export this so I can keep editing it in Final Cut"
  expect:
    actions: [suggest:export]
    export: ["container=mov", "upgrade=none"]
    no_edits: true
- id: studio-export-smallest
  surface: studio
  requires: studio
  fixture_doc: studio/two-clips.txt
  message: "What's the smallest file that still looks good? Set up the export."
  expect:
    actions: [suggest:export]
    export: ["videoCodec=hevc"]
    no_edits: true
- id: studio-export-anon-hevc
  surface: studio
  requires: studio
  tier: anonymous
  fixture_doc: studio/two-clips.txt
  message: "Export it as H.265 please"
  expect:
    actions: [suggest:export]
    export: ["videoCodec=h264", "upgrade=free"]
    any_of: ["sign up", "free account", "account"]
    no_edits: true
- id: studio-export-free-mov
  surface: studio
  requires: studio
  tier: free
  fixture_doc: studio/two-clips.txt
  message: "Export a MOV file"
  expect:
    actions: [suggest:export]
    export: ["container=mp4", "upgrade=premium"]
    any_of: ["Premium"]
    no_edits: true
