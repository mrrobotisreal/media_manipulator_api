# Medi options eval suite (MM116a): does open_tool carry the right form values, from the tool's own schema?
# >= 40 guide cases; run with `assistant-eval --suite options`. Option checks: internal/assistant/evals/options_check.go.

- id: opt-compress-email-smallest
  surface: guide
  suite: options
  message: "compress this video as small as you can, it is for email"
  expect:
    actions: [tool:compress-video]
    options:
      - "compress-video.level = smallest || compress-video.crf in 30..40"
- id: opt-compress-high-quality
  surface: guide
  suite: options
  message: "shrink my video a little but keep the quality high"
  expect:
    actions: [tool:compress-video]
    options:
      - "compress-video.level = high_quality || compress-video.crf in 18..24"
- id: opt-compress-720-h265
  surface: guide
  suite: options
  message: "compress my video to 720p using H.265"
  expect:
    actions: [tool:compress-video]
    options:
      - "compress-video.resolution = 720"
      - "compress-video.codec = h265"
- id: opt-compress-no-audio
  surface: guide
  suite: options
  message: "make my video file smaller and drop the audio track"
  expect:
    actions: [tool:compress-video]
    options:
      - "compress-video.stripAudio = true"
- id: opt-image-resize-800
  surface: guide
  suite: options
  message: "resize my image so it is 800 pixels wide"
  expect:
    actions: [tool:image-resizer]
    options:
      - "image-resizer.width = 800"
- id: opt-image-compress-q60
  surface: guide
  suite: options
  message: "compress my photo with JPEG quality around 60"
  expect:
    actions: [tool:compress-image]
    options:
      - "compress-image.quality in 55..65"
- id: opt-image-compress-keep-detail
  surface: guide
  suite: options
  message: "compress my photo but keep it sharp and high quality"
  expect:
    actions: [tool:compress-image]
    options:
      - "compress-image.quality in 80..95 || compress-image.options absent"
- id: opt-gif-480-15fps
